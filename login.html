<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - MRS Ingeniería y Construcción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="mx-auto mb-4 h-20 w-40 rounded-xl bg-white border border-slate-200 flex items-center justify-center overflow-hidden">
                <img src="logo milton.png" alt="Logo MRS Ingeniería y Construcción" class="max-h-full max-w-full object-contain p-2">
            </div>
            <h1 class="text-2xl font-bold text-slate-900">MRS Ingeniería</h1>
            <p class="text-sm text-slate-500 mt-1">Acceso al sistema de cotizaciones</p>
        </div>

        <form id="loginForm" class="space-y-5" novalidate>
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                <input id="username" name="username" autocomplete="username" required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500"
                    placeholder="Ingrese su usuario">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500"
                    placeholder="Ingrese su contraseña">
            </div>
            <p id="errorMessage" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></p>
            <button type="submit" class="w-full rounded-lg bg-sky-700 py-2.5 font-semibold text-white hover:bg-sky-800 transition">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>Ingresar
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-400">Sistema interno MRS Ingeniería y Construcción</p>
    </main>

    <script>
        const usuarios = {
            mriquelme: { password: 'demo', rol: 'consulta', nombre: 'mriquelme' },
            mriquelmde: { password: 'demo', rol: 'consulta', nombre: 'mriquelmde' },
            mpedreros: { password: 'demo', rol: 'superusuario', nombre: 'mpedreros' }
        };

        document.getElementById('loginForm').addEventListener('submit', (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const usuario = usuarios[username];
            const error = document.getElementById('errorMessage');

            if (!usuario || usuario.password !== password) {
                error.textContent = 'Usuario o contraseña incorrectos.';
                error.classList.remove('hidden');
                return;
            }

            sessionStorage.setItem('mrs_session', JSON.stringify({
                username: usuario.nombre,
                rol: usuario.rol,
                loggedAt: new Date().toISOString()
            }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
